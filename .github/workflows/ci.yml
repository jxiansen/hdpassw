name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Test
        run: cargo test
      - name: Build (CLI + GUI)
        run: cargo build --release --features gui --bins

  build-windows:
    name: Build (Windows x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 \
            binutils-mingw-w64-x86-64
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-win-${{ hashFiles('**/Cargo.lock') }}
      - name: Cross-compile
        run: |
          cargo build --release --target x86_64-pc-windows-gnu \
            --features gui --bins
      - uses: actions/upload-artifact@v4
        with:
          name: hdpassw-windows-x64
          path: |
            target/x86_64-pc-windows-gnu/release/hdpassw.exe
            target/x86_64-pc-windows-gnu/release/hdpassw-gui.exe
          if-no-files-found: error
